<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('Editar Cliente')}">
        <title>Spring Boot</title>       
    </head>

	<body class="bg-light">

	    <!-- HEADER -->	    
	    <div th:replace="~{fragments/header :: header}"></div>

	    <!-- CONTENIDO -->
        <div class="container mt-4">
            <div class="row">
                <div class="col-lg-6 col-md-8 col-sm-10 mx-auto">
                    <div class="card shadow">
                        <div class="card-header bg-warning text-dark">
                            <h3 class="text-center mb-0">
                                <i class="bi bi-pencil-square"></i> Editar Cliente
                            </h3>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/cliente/{id}(id=${cliente.idClie})}"
                                  th:object="${cliente}"
                                  method="POST">
                                <div class="form-group mb-3">
                                    <label><i class="bi bi-hash"></i> Id Cliente</label>
                                    <input type="text"
                                           name="idClie"
                                           th:field="*{idClie}"
                                           class="form-control"
                                           readonly />
                                </div>
                                <div class="form-group mb-3">
                                    <label><i class="bi bi-building"></i> Razón Social</label>
                                    <input type="text"
                                           name="razonSoc"
                                           th:field="*{razonSoc}"
                                           class="form-control"
                                           placeholder="Ingresar Razón Social" />
                                </div>
                                <div class="form-group mb-3">
                                    <label><i class="bi bi-geo-alt"></i> Nombre Ciudad</label>
                                    <input type="text"
                                           name="nombreCiudad"
                                           th:field="*{nombreCiudad}"
                                           class="form-control"
                                           placeholder="Ingresar Nombre Ciudad" />
                                </div>
                                <div class="form-group mb-3">
                                    <label><i class="bi bi-map"></i> Dirección Cliente</label>
                                    <input type="text"
                                           name="direccionClie"
                                           th:field="*{direccionClie}"
                                           class="form-control"
                                           placeholder="Ingresar Dirección Cliente" />
                                </div>
                                <div class="form-group mb-4">
                                    <label><i class="bi bi-telephone"></i> Teléfono</label>
                                    <input type="text"
                                           name="telefono"
                                           th:field="*{telefono}"
                                           class="form-control"
                                           placeholder="Ingresar Teléfono" />
                                </div>
                                <div class="d-flex justify-content-between">
                                    <a th:href="@{/cliente}" class="btn btn-secondary">
                                        <i class="bi bi-arrow-left-circle"></i> Volver
                                    </a>
                                    <button type="submit" class="btn btn-warning text-dark">
                                        <i class="bi bi-check-circle"></i> Actualizar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
		<!-- FOOTER -->
		<div th:replace="~{fragments/footer :: footer}"></div>
		<!-- SCRIPTS -->
		<div th:replace="~{fragments/scripts :: scripts}"></div>
    </body>
</html>
