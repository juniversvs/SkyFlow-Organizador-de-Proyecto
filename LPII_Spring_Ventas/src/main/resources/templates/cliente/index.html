<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Clientes')}">
    <title>Spring Boot</title>
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENIDO -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-people-fill"></i> Lista de Clientes</h2>

            <a th:href="@{/cliente/new}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nuevo Cliente
            </a>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover align-middle">
                <thead class="table-dark text-center">
                    <tr>
                        <th>IdCliente</th>
                        <th>Razón Social</th>
                        <th>Ciudad</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th width="140">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td class="text-center" th:text="${cliente.idClie}"></td>
                        <td th:text="${cliente.razonSoc}"></td>
                        <td th:text="${cliente.nombreCiudad}"></td>
                        <td th:text="${cliente.direccionClie}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td class="text-center">
                            <a th:href="@{/cliente/edit/{id}(id=${cliente.idClie})}"
                               class="btn btn-primary btn-sm"
                               title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/cliente/delete/{id}(id=${cliente.idClie})}"
                               class="btn btn-danger btn-sm"
                               title="Eliminar"
                               onclick="return confirm('¿Desea eliminar este cliente?')">
                                <i class="bi bi-trash-fill"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
