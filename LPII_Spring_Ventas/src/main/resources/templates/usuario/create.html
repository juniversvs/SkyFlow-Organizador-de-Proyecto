<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}">
    <meta charset="ISO-8859-1">
    <title>Registrar Usuario - Sistema de Ventas</title>
</head>
<body class="bg-light">
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENIDO -->
    <div class="container mt-4">
    <div class="row">
            <div class="col-lg-6 col-md-8 col-sm-10 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h3 class="text-center">
                        <i class="bi bi-people-fill text-primary"></i>
                            Crear Nuevo Usuario
                        </h3>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/usuario}"
                              th:object="${usuario}"
                              method="POST">
                            <div class="form-group mb-3">
                                <label>
                                    Nombres
                                </label>
                                <input type="text"
                                       name="nombres"
                                       th:field="*{nombres}"
                                       class="form-control"
                                       placeholder="Ingresar nombres" />
                            </div>

                            <div class="form-group mb-3">
                                <label>
                                    Apellidos
                                </label>
                                <input type="text"
                                       name="apellidos"
                                       th:field="*{apellidos}"
                                       class="form-control"
                                       placeholder="Ingresar apellidos" />
                            </div>

                            <div class="form-group mb-3">
                                <label>
                                    Username
                                </label>
                                <input type="text"
                                       name="username"
                                       th:field="*{username}"
                                       class="form-control"
                                       placeholder="Ingresar username" />
                            </div>

                            <div class="form-group mb-3">
                                <label>
                                    Clave
                                </label>
                                <input type="password"
                                       name="clave"
                                       th:field="*{clave}"
                                       class="form-control"
                                       placeholder="Ingresar clave" />
                            </div>

                            <div class="form-group mb-4">
                                <label>
                                    Rol
                                </label>
                                <select th:field="*{rol}"
                                        name="rolList"
                                        class="form-select">
                                    <option th:each="rol : ${rolList}"
                                            th:value="${rol.id}"
                                            th:text="${rol.descripcion}">
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit"
                                        class="btn btn-primary">
                                        Guardar
                                </button>
                                <a th:href="@{/usuario}"
                                   class="btn btn-secondary">
                                   Regresar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
