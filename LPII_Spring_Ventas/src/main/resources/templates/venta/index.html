<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Nueva Venta')}">
    <title>Spring Boot</title>
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENIDO -->
    <div class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                <h1>
                    <i class="bi bi-cart-check-fill text-success"></i>
                    Lista de Ventas
                </h1>
            </div>
            <div class="col-md-6 text-end">
                <a th:href="@{/venta/new}" class="btn btn-success">
                    <i class="bi bi-cart-plus"></i>
                    Nueva Venta
                </a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">

                <table class="table table-striped table-bordered table-hover align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>N° Venta</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Asesor</th>
                            <th>Subtotal</th>
                            <th>IGV</th>
                            <th>Total</th>
                            <th width="100">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${ventas}">
                            <td class="text-center"
                                th:text="${item.id}">
                            </td>
                            <td th:text="${#dates.format(item.fecha,'dd/MM/yyyy')}">
                            </td>
                            <td th:text="${item.cliente.razonSoc}">
                            </td>
                            <td th:text="${item.asesorVenta.nombres}">
                            </td>
                            <td th:text="${item.subtotal}">
                            </td>
                            <td th:text="${item.igv}">
                            </td>
                            <td th:text="${item.total}">
                            </td>
                            <td class="text-center">
                                <a th:href="@{/venta/verDetalle/{id}(id=${item.id})}"
                                   class="btn btn-primary btn-sm"
                                   title="Ver Detalle">
                                    <i class="bi bi-search"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
