<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Nueva Venta')}">
    <title>Spring Boot</title>
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENIDO -->
    <div class="container mt-3">
        <div class="row mb-3">
            <div class="col-md-12">
                <h2 class="fw-bold">
                    <i class="bi bi-receipt-cutoff text-primary"></i>
                    Detalle de Venta
                </h2>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-list-check"></i>
                Productos Vendidos
            </div>
            <div class="card-body">
                <table class="table table-striped table-bordered table-hover align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>Nro Venta</th>
                            <th>Producto</th>
                            <th>Código</th>
                            <th>Precio Venta</th>
                            <th>Cantidad</th>
                            <th>Importe</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item:${listDetalleVenta}">
                            <td class="text-center"
                                th:text="${item.id.venta.id}">
                            </td>
                            <td th:text="${item.id.producto.descripcion}">
                            </td>
                            <td th:text="${item.id.producto.codigo}">
                            </td>
                            <td th:text="${item.precioVta}">
                            </td>
                            <td class="text-center"
                                th:text="${item.cantidadVta}">
                            </td>
                            <td th:text="${item.importeVta}">
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listDetalleVenta)}">
                            <td colspan="6"
                                class="text-center text-muted">
                                No existen detalles para mostrar
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-3">
            <a th:href="@{/venta}"
               class="btn btn-secondary">
                <i class="bi bi-arrow-left-circle"></i>
                Volver al Listado
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
