<!DOCTYPE html>
<html lang="en"
   xmlns:th="http://www.thymeleaf.org"
>
<head th:replace="~{fragments/head :: head('Login')}">
    <meta charset="UTF-8">
    <title>Registro - Sistema de Ventas</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            Sistema de Ventas
        </a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active"
                       aria-current="page"
                       th:href="@{/}">
                        Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>


<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h3 class="text-center">
                        Registro de Usuario
                    </h3>
                </div>
                <div th:if="${param.success}">
                    <div class="alert alert-success m-3">
                        Te has registrado correctamente en la aplicación.
                    </div>
                </div>
                <div class="card-body">
                    <form
                        method="post"
                        role="form"
                        th:action="@{/register/save}"
                        th:object="${usuario}">
						
                        <div class="form-group mb-3">
                            <label class="form-label">
                                Nombres
                            </label>
                            <input class="form-control"
                                   id="nombres"
                                   name="nombres"
                                   placeholder="Ingresar nombres"
                                   th:field="*{nombres}"
                                   type="text"/>
                            <p th:errors="*{nombres}"
                               class="text-danger"
                               th:if="${#fields.hasErrors('nombres')}">
                            </p>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label">
                                Apellidos
                            </label>
                            <input class="form-control"
                                   id="apellidos"
                                   name="apellidos"
                                   placeholder="Ingresar apellidos"
                                   th:field="*{apellidos}"
                                   type="text"/>
                            <p th:errors="*{apellidos}"
                               class="text-danger"
                               th:if="${#fields.hasErrors('apellidos')}">
                            </p>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label">
                                Usuario
                            </label>
                            <input class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="Ingresar usuario"
                                   th:field="*{username}"
                                   type="text"/>
                            <p th:errors="*{username}"
                               class="text-danger"
                               th:if="${#fields.hasErrors('username')}">
                            </p>
                        </div>


                        <div class="form-group mb-4">
                            <label class="form-label">
                                Clave
                            </label>
                            <input class="form-control"
                                   id="clave"
                                   name="clave"
                                   placeholder="Ingresar clave"
                                   th:field="*{clave}"
                                   type="password"/>
                            <p th:errors="*{clave}"
                               class="text-danger"
                               th:if="${#fields.hasErrors('clave')}">
                            </p>
                        </div>

                        <div class="d-grid mb-3">
                            <button class="btn btn-primary"
                                    type="submit">
                                    Registrar
                            </button>
                        </div>
						
                        <div class="text-center">
                            <span>
                                ¿Ya estás registrado?
                            </span>
                            <a th:href="@{/}">
                                Inicie sesión aquí
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
