<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Productos')}">
    <title>Spring Boot</title>
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENIDO -->
    <div class="container">

        <div class="row mb-3">
            <div class="col-md-6">
                <h1>
                    <i class="bi bi-box-seam"></i>
                    Lista de Productos
                </h1>
            </div>
            <div class="col-md-6 text-end">
                <a th:href="@{/producto/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i>
                    Nuevo Producto
                </a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-bordered table-hover align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>Id</th>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Precio Compra</th>
                            <th>Precio Venta</th>
                            <th>Stock</th>
                            <th>Categoría</th>
                            <th width="140">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}">
                            <td class="text-center"
                                th:text="${producto.idProd}"></td>
                            <td th:text="${producto.codigo}"></td>
                            <td th:text="${producto.descripcion}"></td>
                            <td th:text="${producto.precioCompra}"></td>
                            <td th:text="${producto.precioVenta}"></td>
                            <td class="text-center"
                                th:text="${producto.stock}"></td>
                            <td th:text="${producto.categoria.descripcion}"></td>
                            <td class="text-center">
                                <a th:href="@{/producto/edit/{id}(id=${producto.idProd})}"
                                   class="btn btn-primary btn-sm"
                                   title="Editar">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/producto/delete/{id}(id=${producto.idProd})}"
                                   class="btn btn-danger btn-sm"
                                   title="Eliminar"
                                   onclick="return confirm('¿Desea eliminar este producto?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
