<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Nuevo Producto')}">
    <title>Spring Boot</title>
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENIDO -->
    <div class="container mt-3">

        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0 text-center">
                            <i class="bi bi-box-seam"></i>
                            Crear Nuevo Producto
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/producto}"
                              th:object="${producto}"
                              method="POST">
                            <div class="form-group mb-3">
                                <label>Código</label>
                                <input type="text"
                                       th:field="*{codigo}"
                                       class="form-control bg-light"
                                       readonly />
                            </div>
                            <div class="form-group mb-3">
                                <label>Descripción</label>
                                <input type="text"
                                       th:field="*{descripcion}"
                                       class="form-control"
                                       placeholder="Ingresar descripción" />
                            </div>
                            <div class="form-group mb-3">
                                <label>Precio Compra</label>
                                <input type="number"
                                       step="0.01"
                                       th:field="*{precioCompra}"
                                       class="form-control"
                                       placeholder="Ingresar precio compra" />
                            </div>
                            <div class="form-group mb-3">
                                <label>Precio Venta</label>
                                <input type="number"
                                       step="0.01"
                                       th:field="*{precioVenta}"
                                       class="form-control"
                                       placeholder="Ingresar precio venta" />
                            </div>
                            <div class="form-group mb-3">
                                <label>Stock</label>
                                <input type="number"
                                       th:field="*{stock}"
                                       class="form-control"
                                       placeholder="Ingresar stock" />
                            </div>
                            <div class="form-group mb-4">
                                <label>Categoría</label>
                                <select th:field="*{categoria.id}"
                                        class="form-control">
                                    <option value="">
                                        Seleccione categoría
                                    </option>
                                    <option th:each="categoria : ${categoriaList}"
                                            th:value="${categoria.id}"
                                            th:text="${categoria.descripcion}">
                                    </option>
                                </select>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit"
                                        class="btn btn-success">
                                    <i class="bi bi-save"></i>
                                    Guardar Producto
                                </button>
                                <a th:href="@{/producto}"
                                   class="btn btn-secondary">
                                    <i class="bi bi-arrow-left-circle"></i>
                                    Volver
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
